spec: 1
id: dev.peek.test.opt-render-cap
version: 1
name: Test opt-render-cap
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 900
  render: js
  capture:
  - name: alerts
    url_pattern: '*/api/alerts*'
    format: json
extract:
  fields:
    station:
      from:
      - css: h1
    live_alert:
      from:
      - source: alerts
        json_path: $.alerts[0].title
display:
  layout: list
  row:
    primary: '{station}: {live_alert}'
