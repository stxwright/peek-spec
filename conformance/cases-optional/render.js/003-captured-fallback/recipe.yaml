spec: 1
id: dev.peek.test.opt-render-cap-fb
version: 1
name: Test opt-render-cap-fb
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 900
  render: js
extract:
  fields:
    status:
      from:
      - source: missing_feed
        json_path: $.status
      - css: span#status-fallback
display:
  layout: list
  row:
    primary: '{status}'
