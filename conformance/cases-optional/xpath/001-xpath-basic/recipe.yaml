spec: 1
id: dev.peek.test.opt-xpath-basic
version: 1
name: Test opt-xpath-basic
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    msg:
      from:
      - xpath: //div[@id='wrapper']//p[@class='msg']
display:
  layout: list
  row:
    primary: '{msg}'
