spec: 1
id: dev.peek.test.opt-css-has
version: 1
name: Test opt-css-has
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    hot_card:
      from:
      - css: .card:has(.badge) h2
display:
  layout: list
  row:
    primary: '{hot_card}'
