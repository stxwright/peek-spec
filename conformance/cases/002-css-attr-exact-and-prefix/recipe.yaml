spec: 1
id: dev.peek.test.css-attr-prefix
version: 1
name: Test css-attr-prefix
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    first:
      from:
      - css: a[data-kind='primary']
    by_href:
      from:
      - css: a[href^='https://other.com']
display:
  layout: list
  row:
    primary: '{first}'
