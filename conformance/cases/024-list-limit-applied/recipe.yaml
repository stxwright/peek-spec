spec: 1
id: dev.peek.test.list-limit
version: 1
name: Test list-limit
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  lists:
    l:
      items:
      - css: ul li
      limit: 3
      fields:
        n:
          from:
          - css: :scope
display:
  layout: list
  source: l
  row:
    primary: '{n}'
