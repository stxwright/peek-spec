spec: 1
id: dev.peek.test.css-scope-list
version: 1
name: Test css-scope-list
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  lists:
    rows:
      items:
      - css: table tbody tr
      fields:
        c1:
          from:
          - css: :scope > td:first-child
        c2:
          from:
          - css: :scope > td:nth-child(2)
display:
  layout: list
  source: rows
  row:
    primary: '{c1}'
    secondary: '{c2}'
