spec: 1
id: dev.peek.test.type-sev
version: 1
name: Test type-sev
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    v:
      from:
      - css: p
      type: severity
display:
  layout: list
  row:
    primary: Msg
    badge:
      text: Alert
      severity: '{v}'
