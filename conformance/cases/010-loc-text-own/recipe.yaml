spec: 1
id: dev.peek.test.loc-text-own
version: 1
name: Test loc-text-own
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
