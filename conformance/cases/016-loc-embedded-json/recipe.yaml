spec: 1
id: dev.peek.test.loc-embedded-json
version: 1
name: Test loc-embedded-json
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  lists:
    fruits:
      items:
      - css: script#__DATA__
        json_path: $.items[*]
      fields:
        val:
          from:
          - json_path: $.val
display:
  layout: list
  source: fruits
  row:
    primary: '{val}'
