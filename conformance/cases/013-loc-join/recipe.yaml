spec: 1
id: dev.peek.test.loc-join
version: 1
name: Test loc-join
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    tags:
      from:
      - css: .tags span
        join: ', '
display:
  layout: list
  row:
    primary: '{tags}'
