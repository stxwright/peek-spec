spec: 1
id: dev.peek.test.loc-jsonpath
version: 1
name: Test loc-jsonpath
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: json
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    username:
      from:
      - json_path: $.data.user.name
display:
  layout: list
  row:
    primary: '{username}'
