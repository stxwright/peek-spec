spec: 1
id: dev.peek.test.tpl-null-rule
version: 1
name: Test tpl-null-rule
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    name:
      from:
      - css: '#name'
    desc:
      from:
      - css: '#missing'
      optional: true
display:
  layout: list
  row:
    primary: '{name}'
    secondary: 'Details: {desc}'
