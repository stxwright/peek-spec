spec: 1
id: dev.peek.test.tx-truncate
version: 1
name: Test tx-truncate
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    val:
      from:
      - css: p
      transforms:
      - op: truncate
        max: 16
display:
  layout: list
  row:
    primary: '{val}'
