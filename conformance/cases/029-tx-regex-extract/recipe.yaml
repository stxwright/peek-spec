spec: 1
id: dev.peek.test.tx-regex-extract
version: 1
name: Test tx-regex-extract
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    version:
      from:
      - css: p
      transforms:
      - op: regex_extract
        pattern: v(\d+\.\d+\.\d+)
        group: 1
display:
  layout: list
  row:
    primary: '{version}'
