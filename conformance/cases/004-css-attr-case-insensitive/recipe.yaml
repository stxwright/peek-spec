spec: 1
id: dev.peek.test.css-attr-case-insensitive
version: 1
name: Test css-attr-case-insensitive
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    val:
      from:
      - css: div[data-status='active' i]
display:
  layout: list
  row:
    primary: '{val}'
