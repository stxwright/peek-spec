spec: 1
id: dev.peek.test.css-pseudo-is
version: 1
name: Test css-pseudo-is
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    headline:
      from:
      - css: :is(h1, h2, h3)
display:
  layout: list
  row:
    primary: '{headline}'
