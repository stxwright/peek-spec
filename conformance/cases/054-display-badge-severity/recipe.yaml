spec: 1
id: dev.peek.test.disp-badge
version: 1
name: Test disp-badge
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    s:
      from:
      - css: '#s'
      type: severity
display:
  layout: list
  row:
    primary: Alarm
    badge:
      text: Critical
      severity: '{s}'
