spec: 1
id: dev.peek.test.type-url
version: 1
name: Test type-url
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    v:
      from:
      - css: a
        attr: href
      type: url
display:
  layout: list
  row:
    primary: '{v}'
  link: '{v}'
