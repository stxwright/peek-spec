spec: 1
id: dev.peek.test.disp-kv
version: 1
name: Test disp-kv
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    cpu:
      from:
      - css: '#cpu'
    mem:
      from:
      - css: '#mem'
display:
  title: System Status
  layout: kv
  items:
  - label: CPU Usage
    value: '{cpu}'
  - label: Memory
    value: '{mem}'
  footer: 'Host: srv1'
