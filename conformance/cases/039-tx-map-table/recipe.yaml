spec: 1
id: dev.peek.test.tx-map-table
version: 1
name: Test tx-map-table
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    sev:
      from:
      - css: span.status
      transforms:
      - op: map
        table:
          running: ok
          stopped: bad
      type: severity
display:
  layout: list
  row:
    primary: Status
    badge:
      text: State
      severity: '{sev}'
