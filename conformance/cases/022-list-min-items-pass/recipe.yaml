spec: 1
id: dev.peek.test.min-items-pass
version: 1
name: Test min-items-pass
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  lists:
    l:
      items:
      - css: ul li
      min_items: 2
      fields:
        v:
          from:
          - css: :scope
display:
  layout: list
  source: l
  row:
    primary: '{v}'
