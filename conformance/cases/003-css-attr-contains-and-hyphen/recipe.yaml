spec: 1
id: dev.peek.test.css-attr-contains
version: 1
name: Test css-attr-contains
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    fruit:
      from:
      - css: span[data-tags*='banana']
    lang:
      from:
      - css: span[lang|='en']
display:
  layout: list
  row:
    primary: '{fruit}'
