spec: 1
id: dev.peek.test.loc-text-all
version: 1
name: Test loc-text-all
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    all:
      from:
      - css: '#box'
        text: all
      transforms:
      - op: collapse_ws
display:
  layout: list
  row:
    primary: '{all}'
