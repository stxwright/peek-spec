spec: 1
id: dev.peek.test.tx-parse-time
version: 1
name: Test tx-parse-time
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    time:
      from:
      - css: p
      transforms:
      - op: regex_extract
        pattern: (\d{2}:\d{2}\s+[AP]M)
      - op: parse_time
        format: '%I:%M %p'
      type: time
display:
  layout: list
  row:
    primary: '{time}'
