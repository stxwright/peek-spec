spec: 1
id: dev.peek.test.tx-split-pos
version: 1
name: Test tx-split-pos
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    part:
      from:
      - css: p
      transforms:
      - op: split
        sep: /
        index: 1
display:
  layout: list
  row:
    primary: '{part}'
