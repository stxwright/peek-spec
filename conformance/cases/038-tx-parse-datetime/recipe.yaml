spec: 1
id: dev.peek.test.tx-parse-dt
version: 1
name: Test tx-parse-dt
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    dt:
      from:
      - css: p
      transforms:
      - op: parse_datetime
        format: '%d %b %Y %H:%M:%S'
        tz: Europe/London
      type: datetime
display:
  layout: list
  row:
    primary: '{dt}'
