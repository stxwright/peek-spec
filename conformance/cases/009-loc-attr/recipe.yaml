spec: 1
id: dev.peek.test.loc-attr
version: 1
name: Test loc-attr
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    href:
      from:
      - css: a#main-link
        attr: href
display:
  layout: list
  row:
    primary: '{href}'
