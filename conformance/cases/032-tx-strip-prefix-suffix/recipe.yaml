spec: 1
id: dev.peek.test.tx-strip
version: 1
name: Test tx-strip
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    val:
      from:
      - css: p
      transforms:
      - op: strip_prefix
        value: --
      - op: strip_suffix
        value: --
display:
  layout: list
  row:
    primary: '{val}'
