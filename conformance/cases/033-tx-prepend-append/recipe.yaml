spec: 1
id: dev.peek.test.tx-prepend-append
version: 1
name: Test tx-prepend-append
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    val:
      from:
      - css: p
      transforms:
      - op: prepend
        value: "\xA3"
      - op: append
        value: ' GBP'
display:
  layout: list
  row:
    primary: '{val}'
