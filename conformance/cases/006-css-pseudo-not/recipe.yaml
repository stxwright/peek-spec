spec: 1
id: dev.peek.test.css-pseudo-not
version: 1
name: Test css-pseudo-not
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    item:
      from:
      - css: '#items li:not(.hidden)'
display:
  layout: list
  row:
    primary: '{item}'
