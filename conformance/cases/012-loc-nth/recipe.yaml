spec: 1
id: dev.peek.test.loc-nth
version: 1
name: Test loc-nth
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    second:
      from:
      - css: ul li
        nth: 1
display:
  layout: list
  row:
    primary: '{second}'
