spec: 1
id: dev.peek.test.css-basic
version: 1
name: Test css-basic
description: Conformance test recipe
fetch:
  url: https://example.com/test
  format: html
  allowed_domains:
  - example.com
  min_interval_s: 300
extract:
  fields:
    title:
      from:
      - css: h1#title
    text:
      from:
      - css: p.content
display:
  layout: kv
  items:
  - label: Title
    value: '{title}'
  - label: Text
    value: '{text}'
